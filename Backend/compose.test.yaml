services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: staysync_test
      POSTGRES_USER: staysync_test
      POSTGRES_PASSWORD: staysync_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staysync_test -d staysync_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
